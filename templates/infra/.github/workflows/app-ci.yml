name: App checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt -r data/requirements-ml.txt
      - run: python -m unittest discover -s backend/tests -v
      - run: python -m unittest discover -s ai/tests -v
      - run: python -m unittest discover -s data/tests -v
      - run: python -m unittest discover -s data/ml_tests -v
      - run: npm ci --no-audit --no-fund && npm test && npm run build
        working-directory: frontend
      - run: docker compose config --quiet
