name: Toolkit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: templates/frontend/package-lock.json
      - run: python -m pip install -r templates/backend/requirements.txt -r templates/data/requirements-ml.txt
      - run: python tools/validate.py && python -m unittest discover -s tests -v
      - run: python -m unittest discover -s templates/backend/tests -v
        env:
          PYTHONPATH: templates
      - run: python -m unittest discover -s templates/ai/tests -v
        env:
          PYTHONPATH: templates
      - run: python -m unittest discover -s templates/data/tests -v
        env:
          PYTHONPATH: templates
      - run: python -m unittest discover -s templates/data/ml_tests -v
        env:
          PYTHONPATH: templates
      - run: npm ci --no-audit --no-fund && npm test && npm run build
        working-directory: templates/frontend
      - name: Build installed app container
        run: |
          mkdir -p "$RUNNER_TEMP/toolkit-app"
          python tools/install.py --target "$RUNNER_TEMP/toolkit-app" --profile fullstack --apply
          cd "$RUNNER_TEMP/toolkit-app"
          docker compose config --quiet
          docker build -t toolkit-smoke .
